# Default configuration. Run configs (configs/runs/*.yaml) override these keys.
# Values marked "from timing" are placeholders until `locfix eval timing` runs on Kaggle L4x4.

seed: 1234

paths:                         # local defaults; override in configs/paths.yaml (see paths.example.yaml)
  data_root: ./work/data/codeagent_final
  competition_data: ./work/data/gemma4-dev
  vendor_wheels: ./vendor
  models: ./work/models
  records: ./work/records
  runs: ./work/runs
  eval: ./work/eval
  golden: ./work/golden
  codeagent_validate: ./work/codeagent-validate

versions:                      # Kaggle scoring wheelhouse; serve env must match exactly
  vllm: 0.19.1
  transformers: 5.13.1
  swegemma: 0.2.11
  adk_submission: 0.2.13
  adk_eval_core: 0.1.0

models:
  e4b:
    serve_id: gemma-4-e4b-it-qat-w4a16-ct
    hf_ct: google/gemma-4-e4b-it-qat-w4a16-ct
    kaggle: google/gemma-4/other/gemma-4-e4b-it-qat-w4a16-ct/2      # where the checkpoint is available
    dequantized: ${paths.models}/gemma4-e4b-w4a16-dequant-bf16
    lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]  # confirm vs vLLM (spec 01)
  31b:
    serve_id: gemma-4-31b-it-qat-w4a16-ct
    hf_ct: google/gemma-4-31b-it-qat-w4a16-ct
    kaggle: google/gemma-4/other/gemma-4-31b-it-qat-w4a16-ct/2
    dequantized: ${paths.models}/gemma4-31b-w4a16-dequant-bf16
    lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]  # k/v sharing check (spec 01)
  12b:
    serve_id: gemma-4-12b-it-qat-w4a16-ct
    hf_ct: google/gemma-4-12b-it-qat-w4a16-ct
    dequantized: ${paths.models}/gemma4-12b-w4a16-dequant-bf16
    text_only_class: Gemma4ForCausalLM
    lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

harness:                       # must equal the Kaggle scorer (docs/reference/harness_facts.md)
  max_model_len: 32768
  tool_call_parser: gemma4
  reasoning_parser: gemma4
  compaction: {compaction_interval: 15, overlap_size: 2, token_threshold: 14336, event_retention_size: 5}
  read_file_max_lines: 150
  read_file_max_chars: 10000
  max_stdout_chars: 5000
  command_timeout_seconds: 300

budget:                        # eval_config.yaml of the submission; records are built with the same values
  max_time_minutes: 8          # the teacher's own limit (training setting; the submission may differ)
  max_tool_calls: 36           # keeps 92.5% of cleaned_v2; warning fires at <= 10 remaining
  max_turns: 300

budget_locfix:                 # agents/locfix/eval_config.yaml. The localizer's calls and the fixer's
  max_time_minutes: 8          # reads of z share one task budget, so the two-agent structure needs
  max_tool_calls: 44           # more calls than the single agent for the same work (spec 04 §5): +8
  max_turns: 300

timing:                        # from timing (spec 07); tokens/s on Kaggle 4xL4
  e4b: {prefill_tps: null, decode_tps: null, setup_seconds: null}
  31b: {prefill_tps: null, decode_tps: null, setup_seconds: null}

generation:                    # agent sampling; keep the team's tested values unless Stage 0 says otherwise
  include_thoughts: true
  thinking_budget: 4096
  max_output_tokens: 16384

data:
  training_layout: auto        # one_sequence | per_turn; set by the prefix-consistency test (spec 02)
  replay_compaction: false     # replay with the harness's context compaction (needs a summarizer, spec 03)
  max_trace_tokens: 32768      # record builders (with --tokenizer): drop a trajectory if any of its
                               # records renders longer than this (two-agent: drop that record)
  teacher_time_minutes: 8      # time limit the teacher trajectories were generated with
  time_scale: auto             # get_status clock = teacher clock x time_scale; auto = budget minutes /
                               # teacher_time_minutes (the teacher's used fraction of its time is kept)
  val_fraction: 0.03
  exclude_repos: [fastapi, requests, rich, httpx]   # dev-set repositories (match any owner)
  heldout_size: 300

train:                         # `locfix train` (src/locfix/train/sft.py); a run config sets model,
  model: e4b                   # role, sources and output_dir
  role: agent                  # agent | fixer | localizer (which adapter this run trains)
  sources: []                  # [{path, weight: 1.0, repeat: 1.0, name}] record files and their mix
  val_sources: []              # held-out record files: NLL per stage at every epoch end
  output_dir: null
  base_model: null             # default: models.<model>.dequantized
  tokenizer: null              # default: the base model folder
  init_adapter: null           # warm start from an adapter folder (EM rounds, Stage 5)
  lr_scale: 1.0                # multiplies lr[model] (0.5 for warm starts)
  learning_rate: null          # explicit LR instead of lr[model] × lr_scale
  max_seq_len: 32768
  lora: {r: 64, alpha: 32, dropout: 0.0, use_rslora: false}
  optimizer: {name: adamw, hf_name: adamw_torch, betas: [0.9, 0.999], weight_decay: 0.0, grad_clip: 1.0}
  schedule: {warmup_steps: 10, decay: cosine, min_lr_ratio: 0.1}
  global_batch_sequences: 16   # rows per optimizer step (all GPUs × accumulation × per_device_batch)
  per_device_batch: 1          # rows per forward (rows are packed or single records; no padding)
  gradient_checkpointing: true
  packing: false               # true: several short records per row (first-fit, ≤ max_seq_len tokens)
  length_grouping: false       # true: rows of similar length in the same step (less waiting across GPUs)
  attn_implementation: sdpa    # sdpa (tested, packing-safe) | flex_attention | flash_attention_2
  ce_chunk: 1024               # trained tokens per chunk of the vocabulary projection
  bf16: true
  cache_dir: ${paths.records}/token_cache   # tokenized records (reused across runs)
  logging_steps: 1
  report_to: []                # e.g. [wandb]
  export: true                 # write vLLM-ready adapters (k_eq_v fix, bf16) under <output_dir>/export
  lr: {e4b: 2.0e-4, 31b: 1.0e-4, 12b: 1.0e-4}
  epochs: 3
  save_every_epoch: true
  warm_start_lr_scale: 0.5     # EM rounds and Stage 5
  target_visits_per_patch: 3

search:                        # sweeps (docs/reference/hyperparameters.md)
  lr: {e4b: [1.0e-4, 2.0e-4, 4.0e-4], 31b: [5.0e-5, 1.0e-4, 2.0e-4]}
  rank: {e4b: [32, 64], 31b: [32, 64]}
  global_batch_sequences: [8, 16]

em:
  K: 8
  sample_temperature: 0.8
  ess_target: 2                # 1 = hard EM; search {1, 2, 4}
  ctx_cost_sigma: 0.25         # search {0, 0.25, 0.5}
  req_cost_sigma: 0.25         # search {0.1, 0.25, 0.5}
  beta: 0.5                    # search {0.25, 0.5, 1.0}
  resample_m: 3
  no_request_fraction: 0.4
  max_locations: 8
  ctx_budget_tokens: 6000
  localizer_max_calls: 15      # keeps 92.1% of explorations (12: 86.8%)
  max_rounds: 3
  unsolved_ratio: 0.0          # Stage 4 search {0, 0.5, 1.0}

eval:
  seeds: [0, 1]
  concurrency: 32
