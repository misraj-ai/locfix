# Stage 1: single agent on full teacher trajectories, E4B.
#   accelerate launch --config_file configs/accelerate/ddp_8gpu.yaml -m locfix.cli train --config configs/runs/S1-e4b.yaml
train:
  model: e4b
  role: agent
  sources:
    - {path: "${paths.records}/s1_agent.jsonl"}
  val_sources:
    - {path: "${paths.records}/val/s1_agent.jsonl"}
  output_dir: "${paths.runs}/S1-e4b"
  epochs: 3
