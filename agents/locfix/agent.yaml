# Our method: fixer is the root agent; the localizer is a sub-agent called as a tool.
name: fixer
model: gemma-4-31b-it-qat-w4a16-ct
# adapter: fix_lora
instruction: !include prompts/fixer.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - agent_tool:
      config_path: sub_agents/localizer.yaml
      skip_summarization: false    # true ends the fixer turn after the call -> harness nudge (harness_facts §15)
generate_content_config: !include configs/sampling.yaml
