[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "locfix"
version = "0.1.0"
description = "Joint localizer-fixer training via SFT for Gemma 4 software-engineering agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Harness wheels are not on PyPI: install them from vendor/ (see README).
harness = ["google-adk>=1.34,<2", "litellm>=1.0", "mcp>=2"]  # litellm>=1.106 imports mcp 2.x types
train = ["transformers==5.13.1", "peft", "trl", "accelerate", "liger-kernel", "safetensors", "compressed-tensors"]
serve = ["vllm==0.19.1", "transformers==5.13.1"]
dev = ["pytest>=8", "ruff"]

[project.scripts]
locfix = "locfix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/locfix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: needs a CUDA GPU",
  "hf: needs Hugging Face downloads (tokenizer or model)",
  "vllm: needs vLLM",
]
addopts = "-m 'not gpu and not hf and not vllm'"

[tool.ruff]
line-length = 100
target-version = "py312"
