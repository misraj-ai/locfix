[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "locfix"
version = "0.1.0"
description = "Joint localizer-fixer training via SFT for Gemma 4 software-engineering agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Harness wheels are not on PyPI: install them from vendor/ (see README).
harness = ["google-adk==1.39.1", "litellm==1.106.3"]  # then `pip install mcp==2.3.0` (litellm needs mcp 2.x; google-adk declares <2): see README
train = ["transformers==5.13.1", "peft", "accelerate", "safetensors", "compressed-tensors"]
serve = ["vllm==0.19.1", "transformers==5.13.1"]
dev = ["pytest>=8", "ruff"]

[project.scripts]
locfix = "locfix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/locfix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: needs a CUDA GPU",
  "hf: needs Hugging Face downloads (tokenizer or model)",
  "vllm: needs vLLM",
  "multiproc: starts 2 training processes (run alone: pytest -m multiproc; ~1 min, ~3 GB RAM)",
]
addopts = "-m 'not gpu and not hf and not vllm and not multiproc'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]      # notebooks are generated (tools/build_inspect_notebook.py)

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]          # long lines are allowed where they keep a table or a message readable

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]                              # scripts put src/ on sys.path first
"notebooks/*_standalone.py" = ["E402", "F811"]       # generated single-file scripts
